features:
  backbone: dinov2-small
  image_size: 224
  max_series: 3
  slices_per_series: 4
  neighborhood_offsets: [-1, 0, 1]
  studies_per_part: 50
  num_workers: 4
  minimum_valid_stack_fraction: 0.9

training:
  n_splits: 5
  epochs: 40
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.0001
  gold_weight: 4.0
  patience: 8
  seed: 20260812
  stop_macro_auc: 0.953
  experiments:
    - id: attention_w2_d01_h64
      gold_weight: 2.0
      dropout: 0.1
      attention_hidden_dim: 64
      seed: 20260812
    - id: attention_w4_d02_h128
      gold_weight: 4.0
      dropout: 0.2
      attention_hidden_dim: 128
      seed: 20260829
    - id: attention_w8_d10_h256
      gold_weight: 8.0
      dropout: 0.1
      attention_hidden_dim: 256
      seed: 20260846

calibration:
  method: positive_slope_platt
  cross_fitted: true

inference:
  ensemble: equal_fold_average
  calibration: true
  internet_enabled: false
