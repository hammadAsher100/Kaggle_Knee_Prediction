labeler:
  version: rules_v1
  target_columns:
    - ACL
    - MCL
    - Medial Meniscus
    - Lateral Meniscus
    - Medial OA
    - Lateral OA
    - PF OA
    - Effusion
    - Synovitis
    - Baker's
    - Contusion
    - Fracture
  languages:
    - en
    - es
    - nl
    - fr
    - bg
    - tr
    - el
    - hr
    - de
    - unknown
  unicode_normalization: NFKC
  positive_threshold: 0.9
  negative_threshold: 0.1
  mask_uncertain: true
  allow_hosted_services: false
  output_path: artifacts/labels/report_labels.parquet
