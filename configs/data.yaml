  study_identifier: StudyInstanceUID
  patient_identifier: null
  institution_identifier: null
  report_text_column: Report
  target_columns:
    - ACL
    - MCL
    - Medial Meniscus
    - Lateral Meniscus
    - Medial OA
    - Lateral OA
    - PF OA
    - Effusion
    - Synovitis
    - Baker's
    - Contusion
    - Fracture
  patient_sex_column: PatientSex
  series_identifier: SeriesInstanceUID
  series_descriptor_columns:
    - Fluid_Sensitive
    - Fat_Suppression
    - Anatomical_Plane

submission:
  filename: submission.csv
  columns:
    - StudyInstanceUID
    - ACL
    - MCL
    - Medial Meniscus
    - Lateral Meniscus
    - Medial OA
    - Lateral OA
    - PF OA
    - Effusion
    - Synovitis
