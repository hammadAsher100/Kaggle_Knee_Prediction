[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee-abnormality"
version = "0.1.0"
description = "Competition infrastructure for RSNA Knee Abnormality Detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
data = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=15,<22",
  "pydicom>=2.4,<4",
]
ml = [
  "iterative-stratification>=0.1.9,<0.2",
  "scikit-learn>=1.4,<2",
  "timm>=1.0,<2",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

